start: "Hallo${comma} ${username}! Ich bin ein Computerprogramm, das kommunizieren kann (auch bekannt als 'Bot') und jegliche geheimen Informationen über Nachrichten preisgibt, die du an mich weiterleitest.\n\nProbier's aus, leite ein paar Nachrichten an mich weiter ;)\n\n<b>Hinweis der Entwickler:</b>\nDer Bot befindet sich noch im Anfangsstadium der Entwicklung. Einige Sachen wie Hilfetexte fehlen noch. Wenn du programmieren kannst, werfe einen Blick in die <a href=\"https://github.com/wjclub/telegram-bot-getids\">GitHub repo</a>. Wenn du anderweitig behilflich sein willst, melde dich bei @wjclub."
human: "lieber Mitbürger"
help: |
  Sende mir eine weitergeleitete Nachricht im privaten Chat, und ich zeige dir nützliche Metadaten (Benutzer, Ursprungs-Chat, Medieninfos, versteckte Links und mehr).

  <b>Befehle:</b>
  » /start zeigt die Einleitung + deine Account-Infos
  » /admins listet die aktuellen Admins dieses Chats auf (nur Gruppen)
  » /json antworte auf eine Nachricht, um ihr Bot-API-JSON zu erhalten
  » /user antworte auf eine Nachricht, um Infos zu diesem Benutzer anzuzeigen

  Für mehr Informationen darüber, wie ich das Account-Erstellungsdatum schätze, sende /idhelp

  Mein Quellcode ist auf <a href="https://github.com/wjclub/telegram-bot-getids">GitHub</a> verfügbar.
idhelp: |
  <b>Erstellungsdatum des Accounts</b>

  <b>Wie es funktioniert</b>
  Um @Superuser27 (übersetzt) zu zitieren: Interpolation zwischen Account IDs, deren Erstellungsdatum bekannt ist.
  Der Bot hat eine große Liste an Account IDs mit deren Erstellungsdatum, mit denen sich eine unbekannte ID vergleichen lässt.

  <b>Mein Account Erstellungsdatum ist falsch</b>
  Kann sein. Deshalb klatschen wir ein "~" davor. Wir können nur raten und häufig unterscheiden sich die zur Verfügung stehenden IDs gewaltig vom Zeitpunkt der Erstellung, was nur zu einem Datenchaos führen kann. Wenn man's aber als mathematisches Kunststück betrachtet, könnte es auch richtig sein.

  <b>Kann ich diese Liste bekommen?</b>
  Klar, das ist die Schönheit von Open Source: <a href="https://github.com/wjclub/telegram-bot-getids/blob/master/src/ages.json">Sie ist als JSON-Datei auf GitHub</a> verfügbar.
