start: "Привет${comma} ${username}! Я компьютерная программа, которая умеет общаться (то есть, 'бот') и я могу тебе рассказать кое-что о Вас и о сообщениях, которые Вы можете отправить мне.\n\nПросто попробуйте переслать мне несколько сообщений ;)\n\n<b>Примечание от разработчика:</b>\nЭто очень ранняя версия бота. Поэтому некоторые вещи (например, поясняющие подсказки и прочее) пока отсутствуют. Если Вы разработчик, Вы можете помочь - вот <a href=\"https://github.com/wjclub/telegram-bot-getids\">репозиторий на GitHub</a>. Если Вы не разработчик, Вы тоже можете помочь. Просто напишите нам — @wjclub."
human: "пользователь"
idhelp: |
  <b>Дата создания аккаунта</b>

  <b>Как это работает?</b>
  Цитата @Superuser27: Интерполяция по известным датам регистрации некоторых определённых аккаунтов.
  Бот имеет большой список идентификаторов аккаунтов и связанных с ним известных дат создания и сравнивает ваш идентификатор с этим списком.

  <b>Дата создания моего аккаунта неверна!</b>
  Конечно. Поэтому перед датой стоит знак "~". Показываемая дата — всего лишь предположение, и очень часто идентификаторы, выдаваемые за один промежуток времени, очень сильно отличаются друг от друга, что приводит к беспорядку в данных. Так что просто считайте дату, в каком-то роде, искусством.
