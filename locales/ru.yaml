group_chat_start: |
  GetIDsBot - Получить мета-информацию в Telegram

  <b>Доступные команды:</b>
  » <code>/admins</code> — получить список всех администраторов этого группового чата.
  » <code>/json</code> — в ответ на сообщение для получения его в формате Bot API JSON.
  » <code>/user</code> — в ответ на сообщение для получения информации о пользователе.

  ${chatInfoStr}

